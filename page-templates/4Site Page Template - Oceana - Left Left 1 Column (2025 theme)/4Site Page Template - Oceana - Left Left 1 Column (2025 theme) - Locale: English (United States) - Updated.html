<body data-engrid-theme="oceana" data-engrid-layout="leftleft1col" data-engrid-theme-version="202503" data-engrid-add-input-placeholders data-replace-banner-with-background="if-banner-empty" data-conditonally-hide-show-digital-wallet-elements>
<!-- 2025 Redesign Rollout to Donation and Sign Up pages -->
<script>
  /**
   * This script applies 2025 redesign updates if:
   * - The URL includes "assets=redesign" (forced override), OR
   * - `pageJson.pageType` is "donation", "signup", "unsubscribe", "otherdatacapture", "event", "survey", "click2call", "emailsubscribeform", "emailtotarget", "advocacypetition" or "supporterhub"
   *
   * Immediately:
   * - Adds/updates data attributes on <body>:
   *    - data-engrid-theme-version = "202503"
   *    - data-engrid-layout = "leftleft1col"
   *    - data-replace-banner-with-background = "if-banner-empty"
   * - Removes the class "radio-to-buttons_donationAmt" from <body>
   *
   * On DOMContentLoaded:
   * 1. Adds .radio-to-buttons_donationAmt to `.en__field--donationAmt`'s first `.en__component--formblock` ancestor
   * 2. Removes .give-by-select_count_3 from the relevant element
   * 3. Replaces old credit card image with the Oceana version
   * 4. If the Oceana logo AND tagline are found:
   *    - Removes the parent `.en__component--imageblock` of the tagline image
   *    - Adds [data-engrid-no-body-banner] to <body>
   * 5. If `.radio-to-buttons_recurrfreq` is missing:
   *    - Adds it to the parent of `.en__field--recurrfreq`
   * 6. If `.page-backgroundImage img` has no [data-attribution-source]:
   *    - Sets fallback penguin image, alt text, and inline CSS var on `.page-backgroundImage`
   * 7. If `<h2>DONATION INFORMATION</h2>` or `<h2><strong>donation information</strong></h2>` appears:
   *    - Removes its parent `.en__component--copyblock`
   * 8. If no nudge image, no inline message, and no paycurrency field:
   *    - Adds `margin-bottom: 2rem` to `.en__field--recurrfreq`
   */
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    const forceRedesign = urlParams.get('assets') === 'redesign';
    const validPageType = typeof pageJson === 'object' && pageJson.pageType &&
      ['donation', 'signup', 'unsubscribe', 'otherdatacapture', 'event', 'survey', 'click2call', 'emailsubscribeform', 'emailtotarget', 'advocacypetition', 'supporterhub', 'premiumgift'].includes(pageJson.pageType);


    if (forceRedesign || validPageType) {
      // Run immediately — body-related changes
      const body = document.body;
      body.setAttribute('data-engrid-theme-version', '202503');
      body.setAttribute('data-engrid-layout', 'leftleft1col');
      body.setAttribute('data-replace-banner-with-background', 'if-banner-empty');
      body.classList.remove('radio-to-buttons_donationAmt');


      // Run after DOM is ready — DOM manipulations
      document.addEventListener('DOMContentLoaded', function () {
        // Step 1: Add class to donationAmt field's .en__component--formblock parent
        const donationAmtField = document.querySelector('.en__field--donationAmt');
        if (donationAmtField) {
          let parent = donationAmtField.parentElement;
          while (parent && !parent.classList.contains('en__component--formblock')) {
            parent = parent.parentElement;
          }
          if (parent && !parent.classList.contains('radio-to-buttons_donationAmt')) {
            parent.classList.add('radio-to-buttons_donationAmt');
          }
        }


        // Step 2: Remove .give-by-select_count_3 class
        const giveBy = document.querySelector('.give-by-select_count_3');
        if (giveBy) {
          giveBy.classList.remove('give-by-select_count_3');
        }


        // Step 3: Replace credit card image
        const oldCardSrc = 'https://aaf1a18515da0e792f78-c27fdabe952dfc357fe25ebf5c8897ee.ssl.cf5.rackcdn.com/1997/credit-cards.png?v=1675169734000';
        const newCardSrc = 'https://aaf1a18515da0e792f78-c27fdabe952dfc357fe25ebf5c8897ee.ssl.cf5.rackcdn.com/1997/oceana-cards.png';
        document.querySelectorAll('img').forEach(img => {
          if (img.src === oldCardSrc) {
            img.src = newCardSrc;
          }
        });


        // Step 4: Remove banner imageblock if both logo + tagline are present
        const logoImgSrc = 'https://aaf1a18515da0e792f78-c27fdabe952dfc357fe25ebf5c8897ee.ssl.cf5.rackcdn.com/1997/oceana-logo.png';
        const taglineImgSrc = 'https://aaf1a18515da0e792f78-c27fdabe952dfc357fe25ebf5c8897ee.ssl.cf5.rackcdn.com/1997/Oceana_English_SideTagline_2Blue_RGB+-+Copy.png?v=1638473655000';


        const logoImg = document.querySelector(`img[src="${logoImgSrc}"]`);
        const taglineImg = document.querySelector(`img[src="${taglineImgSrc}"]`);


        if (logoImg && taglineImg) {
          const imageBlock = taglineImg.closest('.en__component--imageblock');
          if (imageBlock) {
            imageBlock.remove();
            body.setAttribute('data-engrid-no-body-banner', '');
          }
        }


        // Step 5: Add .radio-to-buttons_recurrfreq if missing
        if (!document.querySelector('.radio-to-buttons_recurrfreq')) {
          const recurrField = document.querySelector('.en__field--recurrfreq');
          if (recurrField && recurrField.parentElement) {
            recurrField.parentElement.classList.add('radio-to-buttons_recurrfreq');
          }
        }


        // Step 6: Set fallback background image if no attribution
        const bgImageWrapper = document.querySelector('.page-backgroundImage');
        const bgImage = bgImageWrapper?.querySelector('img');
        const fallbackSrc = 'https://aaf1a18515da0e792f78-c27fdabe952dfc357fe25ebf5c8897ee.ssl.cf5.rackcdn.com/1997/shutterstock_345567323.jpg';


        if (bgImage && !bgImage.hasAttribute('data-attribution-source')) {
          const activeSrc = bgImage.getAttribute('src') || bgImage.getAttribute('data-src');
          if (activeSrc !== fallbackSrc) {
            bgImage.setAttribute('src', fallbackSrc);
            bgImage.setAttribute('alt', 'Two Penguins standing alone');
            bgImageWrapper.style.setProperty('--engrid__page-backgroundImage_url', `url('${fallbackSrc}')`);
          }
        }


        // Step 7: Remove "DONATION INFORMATION" copyblocks
        document.querySelectorAll('.en__component--copyblock h2').forEach(h2 => {
          const isDirectMatch = h2.textContent.trim().toLowerCase() === 'donation information';
          const isStrongMatch = h2.innerHTML.trim().toLowerCase() === '<strong>donation information</strong>';
          if (isDirectMatch || isStrongMatch) {
            const copyBlock = h2.closest('.en__component--copyblock');
            if (copyBlock) {
              copyBlock.remove();
            }
          }
        });


        // Step 8: Add margin if no nudge, inline message, or paycurrency
        const nudgeImgMissing = !document.querySelector('img[src*="nudge-right.png?v=1704205430000"]');
        const noInlineMessage = !document.querySelector('.inline-donation-message');
        const noPayCurrency = !document.querySelector('.en__field--paycurrency');


        if (nudgeImgMissing && noInlineMessage && noPayCurrency) {
          const recurrFreq = document.querySelector('.en__field--recurrfreq');
          if (recurrFreq) {
            recurrFreq.style.marginBottom = '2rem';
          }
        }
      });
    }
  })();
</script>
